name: Build-TVBox-Custom-Media
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 主项目
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 检出 zhangqun66 的 Media 仓库
        uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 3. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 编译 Media 驱动 (生成 AAR)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../TV/app/libs
          AAR_FILES=$(find . -name "*-release.aar")
          for aar in $AAR_FILES; do
            cp "$aar" ../TV/app/libs/
          done

      - name: 5. 整合并编译 TV APK (修复资源缺失)
        run: |
          cd TV
          PYTHON_PATH=$(which python3)
          echo "python.executable=$PYTHON_PATH" > local.properties
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          FILE="app/build.gradle"
          if [ -f "$FILE" ]; then
            # 1. 引入本地 AAR
            sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
            
            # 2. 补回被排除掉的 Google Play 服务基础资源 (修复 AAPT 报错的关键)
            sed -i '/dependencies {/a \    implementation "com.google.android.gms:play-services-basement:18.3.0"' "$FILE"
            
            # 3. 这里的策略改为：不再使用 exclude group，而是通过 resolutionStrategy 处理冲突
            # 这种方式比强制 exclude 更安全，不会导致资源丢失
            cat <<EOF >> "$FILE"
configurations.all {
    resolutionStrategy {
        // 遇到重复类时，优先使用本地版本 (你编译的版本)
        forcedModules = ['androidx.media3:media3-common:1.1.0'] 
        failOnDuplicateConfigurations = false
    }
}
EOF
          fi
          
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

name: Build-TVBox-Custom-Reference-V7
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 编译 Media 库以获取内核驱动
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          
          # 创建 jniLibs 目录 (这是你参考代码中未体现但运行 MPD 必须的部分)
          mkdir -p ../TV/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../TV/app/src/main/jniLibs/armeabi-v7a
          
          # 物理提取驱动
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../TV/app/src/main/jniLibs/arm64-v8a/ \;
          find temp_extract -name "*.so" -path "*/armeabi-v7a/*" -exec cp {} ../TV/app/src/main/jniLibs/armeabi-v7a/ \;
          
          # 额外检查：确保 dash 和 ffmpeg 驱动都在里面
          echo "✅ 注入驱动列表："
          ls -R ../TV/app/src/main/jniLibs/

      - name: 3. 完美兼容你的 build.gradle 配置
        run: |
          cd TV
          FILE="app/build.gradle"
          
          # 1. 自动开启 gradle.properties 开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\ninclude_dash=true\n" >> gradle.properties
          
          # 2. 强制使用 legacy 模式，这与你提供的 packagingOptions 对应，能提高 so 加载稳定性
          # 已经在你参考的配置中了，我们确保 properties 配合生效
          echo "android.bundle.enableUncompressedNativeLibs=false" >> gradle.properties

          # 3. 针对 dash 模块进行版本对齐 (防止 ClassNotFound)
          # 把你的 media3Version 变量在脚本中强制统一为 1.1.0 左右，这与大多数 media 库匹配
          sed -i 's/media3Version = .*/media3Version = "1.1.0"/g' ../build.gradle || true
          
          # 4. 这里的关键：因为你已经写了 implementation fileTree，
          # 我们只需要确保 AAR 里的 so 不冲突
          sed -i '/packagingOptions {/a \        pickFirst "lib/*/libmedia3ext.so"\n        pickFirst "lib/*/libffmpeg.so"' "$FILE"

      - name: 4. 执行多架构编译
        run: |
          cd TV
          # 注入 Python 路径
          echo "python.executable=$(which python3)" > local.properties
          chmod +x ./gradlew
          # 编译你参考配置中定义的 leanback 分支
          ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon

      - name: 5. 上传最终产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Ref-MPD-Enabled
          path: TV/app/build/outputs/apk/**/*.apk

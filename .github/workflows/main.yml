name: Build-TVBox-Custom-Reference-V9
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境准备 (Java 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 编译 Media 并提取驱动 (带重试逻辑)
        run: |
          cd media
          chmod +x ./gradlew
          
          # 增加重试逻辑，防止网络超时
          for i in {1..3}; do
            echo "尝试编译 Media (第 $i 次)..."
            ./gradlew assembleRelease --no-daemon --stacktrace && break || sleep 15
          done
          
          mkdir -p ../TV/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../TV/app/src/main/jniLibs/armeabi-v7a
          
          # 提取 .so 驱动
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../TV/app/src/main/jniLibs/arm64-v8a/ \;
          find temp_extract -name "*.so" -path "*/armeabi-v7a/*" -exec cp {} ../TV/app/src/main/jniLibs/armeabi-v7a/ \;
          
          echo "✅ 驱动提取成功。"

      - name: 4. 整合编译 (对齐配置)
        run: |
          cd TV
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\ninclude_dash=true\n" >> gradle.properties
          
          FILE="app/build.gradle"
          # 修复 packagingOptions 冲突
          sed -i '/packagingOptions {/a \        pickFirst "lib/*/libmedia3ext.so"\n        pickFirst "lib/*/libffmpeg.so"' "$FILE"
          
          # 强制对齐 media3 版本，防止 Dash 播放时 ClassNotFound
          # 如果你的参考代码里 media3Version 变量在 build.gradle(Project) 里，脚本会自动尝试修改
          sed -i 's/media3Version = .*/media3Version = "1.1.0"/g' ../build.gradle || true

      - name: 5. 执行编译
        run: |
          cd TV
          echo "python.executable=$(which python3)" > local.properties
          chmod +x ./gradlew
          # 编译 Arm64 版本
          ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon

      - name: 6. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-V9-Stable
          path: TV/app/build/outputs/apk/**/*.apk

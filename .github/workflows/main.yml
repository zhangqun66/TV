name: Build-TVBox-No-Compile-Safe-V17
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 【核心】直接获取预编译驱动 (免编译模式)
        run: |
          mkdir -p so_pool/arm64-v8a
          # 下载一个成熟的 FFmpeg 扩展 AAR (来自 anilbeesetti)
          # 这个库支持 MPD 且自带 FFmpeg 驱动，非常稳定
          curl -L https://repo1.maven.org/maven2/io/github/anilbeesetti/nextlib-media3ext/1.1.0-0.9.0/nextlib-media3ext-1.1.0-0.9.0.aar -o ext.aar
          
          # 提取 AAR 里的 so 驱动
          unzip -o ext.aar -d temp_ext
          # 提取 64 位驱动
          cp temp_ext/jni/arm64-v8a/*.so so_pool/arm64-v8a/
          
          echo "✅ 已成功获取现成驱动："
          ls -R so_pool/

      - name: 4. 强制配置环境并注入驱动
        run: |
          cd TV
          PYTHON_EXE=$(which python3)
          echo "python.executable=$PYTHON_EXE" > local.properties
          
          # 开启核心开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\ninclude_dash=true\n" >> gradle.properties
          
          # 物理注入到 app 模块
          mkdir -p app/src/main/jniLibs/arm64-v8a/
          cp ../so_pool/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          
          # 修改 build.gradle 确保打包我们的 so
          FILE="app/build.gradle"
          sed -i '/android {/a \    packagingOptions { jniLibs { useLegacyPackaging true } \n pickFirst "lib/*/libmedia3ext.so" \n pickFirst "lib/*/libffmpeg.so" \n }' "$FILE"

      - name: 5. 执行电视 64 位编译 (带错误诊断)
        run: |
          cd TV
          chmod +x ./gradlew
          # 仅编译 leanback arm64
          ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon --stacktrace || {
            echo "❌ 编译失败，通常是由于依赖冲突。正在尝试强制对齐版本..."
            # 如果失败，强行把 media3Version 变量写死再试一次
            sed -i 's/media3Version = .*/media3Version = "1.1.0"/g' ../build.gradle || true
            ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon
          }

      - name: 6. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-V17-Full-Driver-Edition
          path: TV/app/build/outputs/apk/**/*.apk

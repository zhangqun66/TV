name: Build TVBox with Media Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ checkout TVBox
      - name: Checkout TVBox
        uses: actions/checkout@v4
        with:
          path: tv

      # 2️⃣ checkout media 源码（必须与 tv 同级）
      - name: Checkout Media
        uses: actions/checkout@v4
        with:
          repository: zhangqun66/media
          path: media

      # 3️⃣ 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4️⃣ 验证 projects（可选，但建议先跑）
      - name: Gradle projects check
        working-directory: tv
        run: |
          chmod +x gradlew
          ./gradlew projects

      # 5️⃣ 编译 TVBox Release
      - name: Build TVBox
        working-directory: tv
        run: |
          ./gradlew clean
          ./gradlew assembleRelease

      # 6️⃣ 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-apk
          path: tv/app/build/outputs/apk/**/*.apk

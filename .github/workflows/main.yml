name: Build-TVBox-Custom-Media
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 主项目
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 检出你的专属 Media 驱动仓库
        uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 3. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 编译你的 Media 驱动库 (生成 libmedia3ext.so)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../TV/app/libs
          echo "正在查找编译出的驱动文件..."
          AAR_FILES=$(find . -name "*-release.aar")
          if [ -z "$AAR_FILES" ]; then
            echo "❌ 错误：在 zhangqun66/media 中没找到 AAR！"
            exit 1
          fi
          for aar in $AAR_FILES; do
            cp "$aar" ../TV/app/libs/
            echo "✅ 已拷贝: $(basename $aar)"
          done

      - name: 5. 整合并编译 TV APK
        run: |
          cd TV
          # 修复 Python 路径
          PYTHON_PATH=$(which python3)
          echo "python.executable=$PYTHON_PATH" > local.properties
          
          # 开启 Media3 开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          # 注入 AAR 依赖并排除冲突
          FILE="app/build.gradle"
          if [ -f "$FILE" ]; then
            # 使用 sed 插入 AAR 引用
            sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
            
            # 使用 printf 安全地追加排除配置，避免 EOF 缩进问题
            printf "\nconfigurations.all {\n    exclude group: 'androidx.media3'\n}\n" >> "$FILE"
          fi
          
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: 6. 上传成果物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-zhangqun66-Edition
          path: TV/app/build/outputs/apk/**/*.apk

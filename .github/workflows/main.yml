name: Build TVBox Optimized
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # --- 关键修复：安装 Python 3.10 ---
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 优化 Gradle 环境
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          chmod +x gradlew

      - name: 编译 APK
        # 使用 assembleDebug 避开签名问题
        # 添加 --no-daemon 减少内存占用
        run: ./gradlew assembleDebug -x lint -x test --no-daemon

      - name: 整理 APK 文件
        if: success()
        run: |
          mkdir -p release_files
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_files/ \;

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Debug
          path: release_files/*.apk
        # 优化点：-x lint 和 -x test 跳过无用检查，节省 3-5 分钟
        run: ./gradlew assembleDebug -x lint -x test --stacktrace

      - name: 整理 APK 文件
        run: |
          mkdir -p release_files
          # 自动寻找所有生成的 apk 并重命名，方便识别
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_files/ \;
          ls -R release_files/

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Debug-Build
          path: release_files/*.apk
          retention-days: 7

      - name: 自动创建 Release (可选)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: release_files/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Release-APK
          path: release_files/*

      - name: 发布 Release (可选)
        if: startsWith(github.ref, 'refs/tags/') # 只有推送 tag 时才发布
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

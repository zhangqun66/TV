name: Build-TVBox
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'

      - name: 2. 设置 Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 授权并编译
        # 核心修复：chmod 必须在执行编译之前，且必须紧跟在 run 后面
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. 整理 APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/ \;

      - name: 6. 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Fixed-APK
          path: output/*.apk

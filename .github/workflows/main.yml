name: Build-TVBox-Custom-Media
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 主项目
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 检出 zhangqun66 的 Media 仓库
        uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 3. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 编译 Media 驱动 (生成 AAR)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../TV/app/libs
          # 只拷贝那些不带 ima (广告) 且是 release 版本的 AAR，减少冲突
          find . -name "*-release.aar" ! -name "*ima*" -exec cp {} ../TV/app/libs/ \;
          echo "✅ 驱动已就绪:"
          ls ../TV/app/libs/

      - name: 5. 整合并编译 TV APK (删除冲突行策略)
        run: |
          cd TV
          # 修复 Python 路径
          PYTHON_PATH=$(which python3)
          echo "python.executable=$PYTHON_PATH" > local.properties
          
          # 开启 Media3 开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          FILE="app/build.gradle"
          if [ -f "$FILE" ]; then
            # A. 补全资源库 (解决 google_play_services_version 报错)
            sed -i '/dependencies {/a \    implementation "com.google.android.gms:play-services-basement:18.3.0"' "$FILE"
            
            # B. 引入我们刚编译的本地 AAR
            sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
            
            # C. 关键修复：从文件中直接删除掉所有包含 'androidx.media3' 的远程引用行
            # 既然我们已经有了 AAR，就不需要 build.gradle 里再去下载远程的了
            sed -i '/implementation.*androidx.media3/d' "$FILE"
          fi
          
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: 6. 上传满血版 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Final-NoConflict
          path: TV/app/build/outputs/apk/**/*.apk

name: Build-TVBox-Final-Version
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出官方 Release 代码
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          fetch-depth: 1

      - name: 2. 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. 配置 Python 环境 (修复 MPD 爬虫关键)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 授权并执行编译
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. 扫描并整理 APK 文件
        # 使用 find 命令把所有生成的 apk 移动到统一目录，防止路径报错
        run: |
          mkdir -p output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/ \;

      - name: 6. 发布下载产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Release-Fixed
          path: output/*.apk

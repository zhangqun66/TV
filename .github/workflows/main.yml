name: Build-TVBox-Diagnostic-V15
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境准备
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译并提取驱动
        # 如果这步出错，日志会很清晰，因为它只编译 media
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon || { echo "❌ Media 库 ffmpeg 编译失败"; exit 1; }
          
          mkdir -p ../so_pool/
          find . -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../so_pool/ \;
          echo "✅ 成功提取以下驱动："
          ls ../so_pool/

      - name: 4. 强制配置注入
        run: |
          cd TV
          # 写入 Python 路径
          echo "python.executable=$(which python3)" > local.properties
          # 开启所有开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\ninclude_dash=true\n" >> gradle.properties
          
          # 将提取的 so 注入到 app 模块
          mkdir -p app/src/main/jniLibs/arm64-v8a/
          cp ../so_pool/*.so app/src/main/jniLibs/arm64-v8a/

      - name: 5. 执行极简编译 (禁用检查)
        id: compile
        run: |
          cd TV
          chmod +x ./gradlew
          # 使用 -x 参数跳过所有检查，只做 assemble，减少日志干扰
          ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon -x lint -x test || {
            echo "--------------------------------------------------"
            echo "❌ 编译失败！以下是最后 50 行关键报错信息："
            echo "--------------------------------------------------"
            # 如果编译失败，只抓取最后 50 行报错
            tail -n 50 /home/runner/work/TV/TV/TV/app/build/reports/problems/problems-report.html 2>/dev/null || true
            exit 1
          }

      - name: 6. 物理提取 APK (解决路径找不到问题)
        if: always()
        run: |
          mkdir -p final_apk
          # 无论它在哪，都强制考到当前目录下的 final_apk
          find TV/app/build/outputs/apk -name "*.apk" -exec cp {} final_apk/ \;
          echo "✅ 已将搜寻到的 APK 统一存放到 final_apk 文件夹"
          ls -R final_apk/

      - name: 7. 上传
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-V15-Final
          path: final_apk/*.apk

name: Build TVBox Optimized
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 优化 Gradle 环境
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          chmod +x gradlew

      - name: 编译 APK
        run: ./gradlew assembleDebug -x lint -x test --no-daemon

      - name: 整理 APK 文件
        if: success()
        run: |
          mkdir -p release_files
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_files/ \;

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Debug
          path: release_files/*.apk

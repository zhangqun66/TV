name: Build TVBox Optimized
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 增加权限设置，确保可以发布 release
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 只拉取最新提交，加快速度

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 优化 Gradle 内存与环境
        run: |
          mkdir -p ~/.gradle
          # 限制守护进程内存，防止 GitHub Runner (7GB) 内存溢出
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          # 授予执行权限
          chmod +x gradlew

      - name: 编译 Debug 版本 (跳过签名检查)
        # 优化点：使用 assembleDebug 避免签名报错
        # 优化点：-x lint 和 -x test 跳过无用检查，节省 3-5 分钟
        run: ./gradlew assembleDebug -x lint -x test --stacktrace

      - name: 整理 APK 文件
        run: |
          mkdir -p release_files
          # 自动寻找所有生成的 apk 并重命名，方便识别
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_files/ \;
          ls -R release_files/

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Debug-Build
          path: release_files/*.apk
          retention-days: 7

      - name: 自动创建 Release (可选)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: release_files/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Release-APK
          path: release_files/*

      - name: 发布 Release (可选)
        if: startsWith(github.ref, 'refs/tags/') # 只有推送 tag 时才发布
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

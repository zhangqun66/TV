name: Build TVBox Release Branch
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出 Release 分支代码
        uses: actions/checkout@v4
        with:
          # 关键：强制拉取上游 FongMi 的 release 分支
          repository: 'FongMi/TV' 
          ref: 'release'
          fetch-depth: 1

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 优化 Gradle 环境
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          chmod +x gradlew

      - name: 编译 APK (Debug 版)
        # release 分支的代码已经很完善，直接编译即可
        run: ./gradlew assembleDebug --no-daemon

      - name: 整理 APK 文件
        if: success()
        run: |
          mkdir -p release_files
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_files/ \;

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Release-Branch-Build
          path: release_files/*.apk
              # 在 dependencies 代码块中插入 media3-exoplayer-dash
              sed -i '/dependencies {/a \    implementation "androidx.media3:media3-exoplayer-dash:1.1.0"' "$FILE"
              echo "注入完成。"
            fi
          fi

      - name: 优化 Gradle 环境
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          chmod +x gradlew

      - name: 编译 APK
        run: ./gradlew assembleDebug -x lint -x test --no-daemon

      - name: 整理并上传
        if: success()
        run: |
          mkdir -p release_files
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_files/ \;
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-MPD-Fixed
          path: release_files/*.apk

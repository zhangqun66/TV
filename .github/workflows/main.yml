name: Build-TVBox-Force-Native-So
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译 Media 并“榨取”驱动
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          
          # 提取 so 驱动
          mkdir -p ../so_pool/arm64-v8a/
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../so_pool/arm64-v8a/ \;
          
          # 多点注入到 TV 的所有可能模块
          for target in ../TV/app ../TV/catvod ../TV/quickjs; do
            if [ -d "$target" ]; then
              mkdir -p $target/src/main/jniLibs/arm64-v8a/
              cp -r ../so_pool/arm64-v8a/* $target/src/main/jniLibs/arm64-v8a/
            fi
          done

      - name: 4. 修复配置与 Python 环境
        run: |
          cd TV
          echo "python.executable=$(which python3)" > local.properties
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\ninclude_dash=true\n" >> gradle.properties
          
          # 确保 packagingOptions 允许 so 注入
          FILE="app/build.gradle"
          sed -i '/android {/a \    packagingOptions { jniLibs { useLegacyPackaging true } \n pickFirst "lib/*/libmedia3ext.so" \n pickFirst "lib/*/libffmpeg.so" \n }' "$FILE"

      - name: 5. 执行电视 64 位编译
        run: |
          cd TV
          chmod +x ./gradlew
          # 运行编译
          ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon
          
          # 【关键辅助：打印出生成的 APK 到底在哪】
          echo "------ 实际生成的 APK 路径如下 ------"
          find app/build/outputs/apk -name "*.apk"

      - name: 6. 强力上传 (使用模糊匹配)
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Fixed-Path-APK
          # 使用通配符，只要是 app/build 目录下生成的 apk 全都带走
          path: TV/app/build/outputs/apk/**/*.apk
          # 即使没找到也不要让整个任务显示失败，方便看日志
          if-no-files-found: error

name: Build-TVBox-Custom-Final-V6
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境设置
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译 Media 并“榨取”原生驱动 (.so)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          
          # 创建 TV 项目的最高优先级原生库路径
          mkdir -p ../TV/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../TV/app/src/main/jniLibs/armeabi-v7a
          
          # 核心操作：解压 AAR 并只提取 .so，完全不拷贝 AAR 到 libs 文件夹
          echo "正在从所有 AAR 中提取原生驱动..."
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          
          # 将提取出的 so 拷贝到 TV 的 jniLibs，这步确保了 MPD 所需的驱动进入 APK
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../TV/app/src/main/jniLibs/arm64-v8a/ \;
          find temp_extract -name "*.so" -path "*/armeabi-v7a/*" -exec cp {} ../TV/app/src/main/jniLibs/armeabi-v7a/ \;
          
          echo "✅ 提取完成。我们将不再引入本地 AAR，从源头上杜绝类重复。"
          ls -R ../TV/app/src/main/jniLibs/

      - name: 4. 整合编译 (纯驱动注入模式)
        run: |
          cd TV
          # 修复 Python
          echo "python.executable=$(which python3)" > local.properties
          
          # 开启核心开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          FILE="app/build.gradle"
          # 补回资源基础库
          sed -i '/dependencies {/a \    implementation "com.google.android.gms:play-services-basement:18.3.0"' "$FILE"
          
          # 【关键】这里不再使用 implementation fileTree(dir: "libs", include: ["*.aar"])
          # 这样编译过程会完全使用官方 media3 远程库，不会报 Duplicate Class。
          
          # 强制打包选项，确保我们注入的 so 覆盖官方库里的 so
          printf "\nandroid {\n    packagingOptions {\n        pickFirst 'lib/*/libmedia3ext.so'\n        pickFirst 'lib/*/libffmpeg.so'\n        pickFirst '**/libc++_shared.so'\n    }\n}\n" >> "$FILE"
          
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: 5. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Native-Driver-Only
          path: TV/app/build/outputs/apk/**/*.apk

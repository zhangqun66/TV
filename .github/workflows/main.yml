name: Build-TVBox-Custom-Media
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 主项目
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 检出 zhangqun66 的 Media 仓库
        uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 3. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 编译 Media 驱动 (生成 AAR)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../TV/app/libs
          AAR_FILES=$(find . -name "*-release.aar")
          for aar in $AAR_FILES; do
            cp "$aar" ../TV/app/libs/
            echo "✅ 已拷贝驱动: $(basename $aar)"
          done

      - name: 5. 整合并编译 TV APK (修复资源与语法)
        run: |
          cd TV
          # 1. 修复 Python 路径
          PYTHON_PATH=$(which python3)
          echo "python.executable=$PYTHON_PATH" > local.properties
          
          # 2. 开启核心开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          # 3. 注入依赖与资源补丁
          FILE="app/build.gradle"
          if [ -f "$FILE" ]; then
            # 引入本地 AAR
            sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
            # 补全 Google Play Services 资源，修复上次的 AAPT 报错
            sed -i '/dependencies {/a \    implementation "com.google.android.gms:play-services-basement:18.3.0"' "$FILE"
            
            # 4. 写入冲突解决策略 (使用 printf 避免 EOF 语法错误)
            printf "\nandroid {\n    configurations.all {\n        resolutionStrategy {\n            forcedModules = ['androidx.media3:media3-common:1.1.0']\n            failOnDuplicateConfigurations = false\n        }\n    }\n}\n" >> "$FILE"
          fi
          
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: 6. 上传成果物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Final-Fix
          path: TV/app/build/outputs/apk/**/*.apk

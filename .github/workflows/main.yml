name: Build-TVBox-Full-With-Media-AAR
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 主仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 检出 Media 驱动仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/media'
          path: 'media'

      - name: 3. 设置 Java 17 和 Python 3.10
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 编译 Media AAR (驱动生成)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../TV/app/libs
          find . -name "*.aar" -exec cp {} ../TV/app/libs/ \;
          echo "驱动文件已就绪:"
          ls ../TV/app/libs/

      - name: 5. 整合并编译 TV APK (修复 Python 路径)
        run: |
          cd TV
          # 关键修复：显式指定 Python 可执行文件路径给 Chaquopy
          PYTHON_PATH=$(which python3)
          echo "python.executable=$PYTHON_PATH" >> local.properties
          
          # 开启 Media3 和 FFmpeg 开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          # 注入 AAR 引用逻辑
          sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' app/build.gradle
          
          chmod +x ./gradlew
          # 使用全量编译并忽略缓存
          ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: 6. 上传满血版 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Final-Full-Version
          path: TV/app/build/outputs/apk/**/*.apk

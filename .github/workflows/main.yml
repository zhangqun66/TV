name: Build-TVBox-With-Media-Fix
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 主项目
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 检出 Media 驱动项目 (关键)
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/media'
          path: 'media'

      - name: 3. 环境准备 (Java/Python/NDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: 4. 编译 Media 驱动并生成 AAR
        run: |
          cd media
          chmod +x ./gradlew
          # 编译出包含 MPD/FFmpeg 驱动的 AAR 
          ./gradlew assembleRelease --no-daemon
          # 将生成的 AAR 拷贝到 TV 项目的 libs 目录
          mkdir -p ../TV/app/libs
          find . -name "*.aar" -exec cp {} ../TV/app/libs/ \;
          ls ../TV/app/libs/ # 打印确认一下文件是否进去了

      - name: 5. 注入配置并编译 TV APK
        run: |
          cd TV
          # 确保开启了 media3 开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          # 强行让 build.gradle 引用 libs 下的所有 AAR
          sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' app/build.gradle
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. 上传包含驱动的 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Full-Driver-Fixed
          path: TV/app/build/outputs/apk/**/*.apk

name: Build-TVBox-Python-Fixed
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # --- 关键步骤：必须安装 Python 3.10，否则 Chaquopy 无法打包 ---
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 编译并集成 Python 环境
        # 使用 --no-daemon 确保内存充足，防止 Python 打包过程中断
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传支持 Python/MPD 的 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Python-Support
          path: app/build/outputs/apk/debug/*.apk

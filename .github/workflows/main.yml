name: Build-TVBox-Ultra-Fix
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出官方 Release 代码
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          fetch-depth: 1

      - name: 2. 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 强制注入 MPD 与原生库配置
        # 这里通过 sed 命令直接修改项目属性，强制开启所有解码器扩展
        run: |
          # 确保 gradle.properties 中开启了相关扩展
          echo "include_media3=true" >> gradle.properties
          echo "include_ffmpeg=true" >> gradle.properties
          
          # 暴力修改 app/build.gradle，确保 DASH 依赖被包含
          FILE="app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i '/dependencies {/a \    implementation "androidx.media3:media3-exoplayer-dash:1.1.0"' "$FILE"
            sed -i '/dependencies {/a \    implementation "androidx.media3:media3-ui:1.1.0"' "$FILE"
          fi

      - name: 5. 授权并执行深度编译
        # 使用 --refresh-dependencies 强制云端下载丢失的 .so 预编译库
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: 6. 整理并扫描 APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/ \;

      - name: 7. 上传最终产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Ultra-Fixed
          path: output/*.apk

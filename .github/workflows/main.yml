name: Build-TVBox-Pro-Fix
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          fetch-depth: 1

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 强制刷新环境并编译
        # 增加 --refresh-dependencies 强制重新下载所有播放库
        # 增加 -PtargetSDK=28 (示例) 有时高版本 SDK 会限制 MPD 网络请求
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --refresh-dependencies --stacktrace

      - name: 提取 APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/ \;

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Final-Test
          path: output/*.apk

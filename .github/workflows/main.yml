name: Build-TVBox-Safe-Driver-V18
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 环境准备
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 注入驱动下载配置
        run: |
          cd TV
          # 1. 强制写入 Python 路径
          echo "python.executable=$(which python3)" > local.properties
          
          # 2. 开启核心开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\ninclude_dash=true\n" >> gradle.properties
          
          # 3. 在 build.gradle 中强行插入一个“提取驱动”的任务
          # 这个任务会利用 Gradle 自己的网络能力下载 media3 扩展
          FILE="app/build.gradle"
          sed -i '/dependencies {/a \    implementation "io.github.anilbeesetti:nextlib-media3ext:1.1.0-0.9.0"' "$FILE"
          
          # 修复 packagingOptions 确保 so 优先级
          sed -i '/android {/a \    packagingOptions { jniLibs { useLegacyPackaging true } \n pickFirst "lib/*/libmedia3ext.so" \n pickFirst "lib/*/libffmpeg.so" \n }' "$FILE"

      - name: 4. 执行编译 (由 Gradle 处理一切)
        run: |
          cd TV
          chmod +x ./gradlew
          # 强制对齐版本防止 ClassNotFound
          sed -i 's/media3Version = .*/media3Version = "1.1.0"/g' ../build.gradle || true
          
          # 仅编译电视 64 位版本
          ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon --info || {
            echo "❌ 编译失败，正在尝试清理缓存后重试..."
            ./gradlew clean assembleLeanbackArm64_v8aDebug --no-daemon
          }

      - name: 5. 最终检查并上传
        run: |
          APK_PATH=$(find TV/app/build/outputs/apk -name "*.apk")
          if [ -z "$APK_PATH" ]; then
            echo "❌ 没找到 APK 文件，编译可能静默失败了"
            exit 1
          fi
          echo "✅ 成功找到 APK: $APK_PATH"
          # 检查里面是否有 so 文件
          unzip -l "$APK_PATH" | grep ".so" || echo "⚠️ 警告：APK 内未发现 so 驱动"

      - name: 6. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-V18-Final
          path: TV/app/build/outputs/apk/**/*.apk

name: Build-TVBox-Custom-Final
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境设置
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译 Media 并“物理注入”原生库
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew :lib-exoplayer:assembleRelease :lib-decoder-ffmpeg:assembleRelease --no-daemon
          
          # 创建 TV 项目的原生库存放路径
          mkdir -p ../TV/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../TV/app/src/main/jniLibs/armeabi-v7a
          
          # 提取 AAR 里的 so 文件
          echo "正在提取原生驱动..."
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../TV/app/src/main/jniLibs/arm64-v8a/ \;
          find temp_extract -name "*.so" -path "*/armeabi-v7a/*" -exec cp {} ../TV/app/src/main/jniLibs/armeabi-v7a/ \;
          
          # 同时保留 AAR 作为依赖
          mkdir -p ../TV/app/libs
          find . -name "*-release.aar" -exec cp {} ../TV/app/libs/ \;
          ls -R ../TV/app/src/main/jniLibs/

      - name: 4. 整合编译 (保留 UI 资源)
        run: |
          cd TV
          echo "python.executable=$(which python3)" > local.properties
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          FILE="app/build.gradle"
          # 精准替换：只删除会导致冲突的 core 和 common 库，保留 ui 库提供资源
          sed -i '/implementation.*androidx.media3:media3-exoplayer/d' "$FILE"
          sed -i '/implementation.*androidx.media3:media3-common/d' "$FILE"
          
          # 引入本地 AAR
          sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Full-Driver-Edition
          path: TV/app/build/outputs/apk/**/*.apk

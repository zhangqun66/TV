name: Build-TVBox-Custom-Media
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 主项目
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 检出你的专属 Media 驱动仓库
        uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 3. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 编译你的 Media 驱动库 (生成 libmedia3ext.so)
        run: |
          cd media
          chmod +x ./gradlew
          # 编译所有模块的 Release 版本
          ./gradlew assembleRelease --no-daemon
          
          # 创建 TV 项目的 libs 接收目录
          mkdir -p ../TV/app/libs
          
          # 验证并拷贝 AAR
          echo "正在查找编译出的驱动文件..."
          AAR_FILES=$(find . -name "*-release.aar")
          if [ -z "$AAR_FILES" ]; then
            echo "❌ 错误：在 zhangqun66/media 中没找到 AAR！请检查该仓库代码。"
            exit 1
          fi
          
          for aar in $AAR_FILES; do
            cp "$aar" ../TV/app/libs/
            echo "✅ 已拷贝: $(basename $aar)"
          done

      - name: 5. 整合并编译 TV APK (解决冲突)
        run: |
          cd TV
          # 修复 Python 路径
          PYTHON_PATH=$(which python3)
          echo "python.executable=$PYTHON_PATH" > local.properties
          
          # 开启 Media3 开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          # 注入 AAR 依赖并强制排除官方冲突库
          FILE="app/build.gradle"
          if [ -f "$FILE" ]; then
            # 引入刚才拷贝过来的 AAR
            sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
            
            # 精准排除 androidx.media3 的官方库，确保只用 zhangqun66 编译的版本
            cat <<EOF >> "$FILE"
configurations.all {
    exclude group: 'androidx.media3'
}
EOF
          fi
          
          chmod +x ./gradlew
          # 执行编译
          ./gradlew clean assembleDebug --no-daemon

      - name: 6. 上传成果物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-zhangqun66-Edition
          path: TV/app/build/outputs/apk/**/*.apk

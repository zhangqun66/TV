name: Build-TVBox-Safe-Fix
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          fetch-depth: 1

      - name: 2. 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 安全注入配置 (修复换行问题)
        run: |
          # 使用 printf 确保从新的一行开始追加，避免粘连
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          # 检查并注入 Media3 DASH 依赖
          FILE="app/build.gradle"
          if [ -f "$FILE" ]; then
            # 在 dependencies 块的第一行插入依赖
            sed -i '/dependencies {/a \    implementation "androidx.media3:media3-exoplayer-dash:1.1.0"' "$FILE"
          fi

      - name: 5. 授权并执行编译
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: 6. 整理 APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/ \;

      - name: 7. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Media3-Fixed
          path: output/*.apk

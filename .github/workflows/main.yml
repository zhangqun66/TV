name: Build-TVBox-Custom-Reference-V10
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译 Media 并提取驱动 (.so)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          
          mkdir -p ../TV/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../TV/app/src/main/jniLibs/armeabi-v7a
          
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../TV/app/src/main/jniLibs/arm64-v8a/ \;
          find temp_extract -name "*.so" -path "*/armeabi-v7a/*" -exec cp {} ../TV/app/src/main/jniLibs/armeabi-v7a/ \;
          echo "✅ 驱动已提取"

      - name: 4. 修复 Chaquopy Python 路径与整合配置
        run: |
          cd TV
          # 获取当前环境真实的 python 路径
          PYTHON_EXE=$(which python3)
          echo "使用 Python 路径: $PYTHON_EXE"
          
          # 将路径写入所有可能被引用的地方
          echo "python.executable=$PYTHON_EXE" > local.properties
          
          # 开启核心配置
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\ninclude_dash=true\n" >> gradle.properties
          
          # 修复 packagingOptions 冲突
          FILE="app/build.gradle"
          sed -i '/packagingOptions {/a \        pickFirst "lib/*/libmedia3ext.so"\n        pickFirst "lib/*/libffmpeg.so"' "$FILE"
          
          # 强制对齐 media3 版本
          sed -i 's/media3Version = .*/media3Version = "1.1.0"/g' ../build.gradle || true

      - name: 5. 执行编译 (Leanback Arm64)
        run: |
          cd TV
          chmod +x ./gradlew
          ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon

      - name: 6. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-V10-Final-Fix
          path: TV/app/build/outputs/apk/**/*.apk

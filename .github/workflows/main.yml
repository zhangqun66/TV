name: Build-TVBox-Native-Fix
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          fetch-depth: 1

      - name: 2. 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- 关键步骤：配置 NDK，否则无法生成 .so 库 ---
      - name: 4. 设置 NDK 环境
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.2.9519653' # 使用 Media3 推荐的稳定 NDK 版本

      - name: 5. 强制全量编译 (含原生库)
        # 增加 --refresh-dependencies 确保拉取所有解码组件
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: 6. 整理并上传
        run: |
          mkdir -p output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/ \;

      - name: 7. 发布
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Native-Full
          path: output/*.apk

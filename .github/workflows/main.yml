name: Build TVBox APK

# 触发条件：推送到主分支或手动触发
on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 编译 Release 版本 APK
        run: ./gradlew assembleRelease

      - name: 整理文件
        run: |
          mkdir -p release_files
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release_files/ \;

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Release-APK
          path: release_files/*

      - name: 发布 Release (可选)
        if: startsWith(github.ref, 'refs/tags/') # 只有推送 tag 时才发布
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

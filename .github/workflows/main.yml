name: Build-TVBox-Force-Native-So
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 与 Media 仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境设置 (Java & Python)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译 Media 并“暴力提取” .so 文件
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          
          # 创建 TV 项目的原生库目录
          mkdir -p ../TV/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../TV/app/src/main/jniLibs/armeabi-v7a
          
          # 核心逻辑：解压生成的 AAR 并提取 .so
          echo "正在从 AAR 中提取原生驱动 (.so)..."
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          
          # 将提取出的 so 拷贝到 TV 的 jniLibs
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../TV/app/src/main/jniLibs/arm64-v8a/ \;
          find temp_extract -name "*.so" -path "*/armeabi-v7a/*" -exec cp {} ../TV/app/src/main/jniLibs/armeabi-v7a/ \;
          
          echo "✅ 提取完成，当前 jniLibs 列表:"
          ls -R ../TV/app/src/main/jniLibs/

      - name: 4. 整合并打包 APK
        run: |
          cd TV
          # 修复 Python
          echo "python.executable=$(which python3)" > local.properties
          
          # 开启 Media3
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          FILE="app/build.gradle"
          # 删除远程引用
          sed -i '/implementation.*androidx.media3/d' "$FILE"
          
          # 确保 Gradle 包含 jniLibs 目录
          # (TV 项目通常已有此配置，但我们要确保它生效)
          sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-With-Embedded-So
          path: TV/app/build/outputs/apk/**/*.apk

name: Build-TVBox-Custom-Final-V5
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境设置
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译 Media 并“物理级”注入原生库
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          
          # 创建 TV 项目的原生库路径
          mkdir -p ../TV/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../TV/app/src/main/jniLibs/armeabi-v7a
          
          # 提取并强行注入 .so 驱动
          echo "正在从 AAR 中提取原生驱动并注入 jniLibs..."
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../TV/app/src/main/jniLibs/arm64-v8a/ \;
          find temp_extract -name "*.so" -path "*/armeabi-v7a/*" -exec cp {} ../TV/app/src/main/jniLibs/armeabi-v7a/ \;
          
          # 【关键修正】只拷贝核心 AAR，排除 lib-ui 和 lib-exoplayer-ima
          # 这样就不会与官方远程库产生类重复冲突
          mkdir -p ../TV/app/libs
          find . -name "*-release.aar" ! -name "lib-ui-release.aar" ! -name "*ima*" -exec cp {} ../TV/app/libs/ \;
          
          echo "注入完成，当前 jniLibs 结构："
          ls -R ../TV/app/src/main/jniLibs/

      - name: 4. 整合编译
        run: |
          cd TV
          echo "python.executable=$(which python3)" > local.properties
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          FILE="app/build.gradle"
          # 引入我们刚才精挑细选的本地 AAR
          sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
          
          # 补回 Google 基础资源库
          sed -i '/dependencies {/a \    implementation "com.google.android.gms:play-services-basement:18.3.0"' "$FILE"
          
          # 声明优先级，确保 jniLibs 里的 so 被打入 APK
          printf "\nandroid {\n    packagingOptions {\n        pickFirst 'lib/*/libmedia3ext.so'\n        pickFirst 'lib/*/libffmpeg.so'\n        pickFirst '**/libc++_shared.so'\n    }\n}\n" >> "$FILE"
          
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: 5. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Final-Success-Edition
          path: TV/app/build/outputs/apk/**/*.apk

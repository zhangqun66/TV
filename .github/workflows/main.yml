name: Build-TVBox-Full-With-Media-AAR
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出 TV 主仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'

      - name: 2. 检出 Media 驱动仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/media'
          path: 'media'

      - name: 3. 设置 Java 17 和 Python 3.10
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 编译 Media AAR (生成 libmedia3ext.so)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../TV/app/libs
          # 寻找生成的多个 AAR 文件（包括 ffmpeg, dash 等模块）
          find . -name "*-release.aar" -exec cp {} ../TV/app/libs/ \;
          echo "驱动文件列表："
          ls ../TV/app/libs/

      - name: 5. 整合并编译 TV APK
        run: |
          cd TV
          # 1. 显式配置 Python 路径，解决 Chaquopy 找不到 3.10 的报错
          PYTHON_PATH=$(which python3)
          echo "python.executable=$PYTHON_PATH" > local.properties
          
          # 2. 开启 Media3/FFmpeg 属性
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          # 3. 注入 AAR 依赖（确保 APK 真正包含第4步生成的 so 驱动）
          sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' app/build.gradle
          
          chmod +x ./gradlew
          # 4. 执行 Clean 后再编译，确保 Python 环境刷新
          ./gradlew clean assembleDebug --no-daemon --refresh-dependencies

      - name: 6. 上传满血版 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Final-Full-Version
          path: TV/app/build/outputs/apk/**/*.apk

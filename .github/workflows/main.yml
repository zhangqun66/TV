name: Build-TVBox-Custom-Final-V3
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境设置
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译 Media 并提取原生库 (.so)
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          
          # 创建 TV 项目的原生库存放路径 (jniLibs 是 Android 打包 so 的最高优先级)
          mkdir -p ../TV/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../TV/app/src/main/jniLibs/armeabi-v7a
          
          # 解压并提取 so
          echo "正在提取原生驱动..."
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../TV/app/src/main/jniLibs/arm64-v8a/ \;
          find temp_extract -name "*.so" -path "*/armeabi-v7a/*" -exec cp {} ../TV/app/src/main/jniLibs/armeabi-v7a/ \;
          
          # 将编译好的 AAR 也备一份到 libs
          mkdir -p ../TV/app/libs
          find . -name "*-release.aar" -exec cp {} ../TV/app/libs/ \;
          ls -R ../TV/app/src/main/jniLibs/

      - name: 4. 整合编译 (修复 ClassNotFound 问题)
        run: |
          cd TV
          echo "python.executable=$(which python3)" > local.properties
          
          # 开启内核开关
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\n" >> gradle.properties
          
          FILE="app/build.gradle"
          # 1. 补回基础资源库
          sed -i '/dependencies {/a \    implementation "com.google.android.gms:play-services-basement:18.3.0"' "$FILE"
          
          # 2. 引入本地 AAR (这里包含你编译的 dash, ffmpeg 等核心类)
          sed -i '/dependencies {/a \    implementation fileTree(dir: "libs", include: ["*.aar"])' "$FILE"
          
          # 3. 【核心修复】不再使用 sed 删除 androidx.media3
          # 而是通过全局替换，把官方引用的版本号强制统一，并允许本地 AAR 优先
          # 这样 HLS 等类就能从官方库加载，而 MPD/FFmpeg 驱动会从你的 AAR 加载
          printf "\nandroid {\n    configurations.all {\n        resolutionStrategy {\n            allowDependencySubstitutionAndPrecedenceControl()\n            // 解决类重复，但保留官方基础类\n            failOnDuplicateConfigurations = false\n        }\n    }\n}\n" >> "$FILE"
          
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: 5. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Fixed-Class-Edition
          path: TV/app/build/outputs/apk/**/*.apk

name: Build-TVBox-Force-Inject-So
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          repository: 'FongMi/TV'
          ref: 'release'
          path: 'TV'
      - uses: actions/checkout@v4
        with:
          repository: 'zhangqun66/media'
          path: 'media'

      - name: 2. 环境准备 (Java 17 & Python 3.10)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 编译 Media 并提取 64 位驱动
        run: |
          cd media
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          
          mkdir -p ../so_files/lib/arm64-v8a/
          
          # 提取并重命名驱动（确保名称与 TV 项目代码调用的名称一致）
          find . -name "*-release.aar" -exec unzip -o {} -d temp_extract \;
          find temp_extract -name "*.so" -path "*/arm64-v8a/*" -exec cp {} ../so_files/lib/arm64-v8a/ \;
          
          echo "✅ 准备注入的驱动列表："
          ls -R ../so_files/

      - name: 4. 修复 TV 项目配置
        run: |
          cd TV
          PYTHON_EXE=$(which python3)
          echo "python.executable=$PYTHON_EXE" > local.properties
          printf "\ninclude_media3=true\ninclude_ffmpeg=true\ninclude_dash=true\n" >> gradle.properties
          
          # 强制对齐版本，防止 ClassNotFound
          sed -i 's/media3Version = .*/media3Version = "1.1.0"/g' ../build.gradle || true

      - name: 5. 正常编译 APK
        run: |
          cd TV
          chmod +x ./gradlew
          ./gradlew assembleLeanbackArm64_v8aDebug --no-daemon

      - name: 6. 【核心步骤】暴力注入 .so 到已生成的 APK
        run: |
          APK_PATH=$(find TV/app/build/outputs/apk -name "*.apk")
          echo "目标 APK: $APK_PATH"
          
          # 进入驱动存放目录
          cd so_files
          
          # 使用 zip 命令将 lib/ 目录强制更新/加入到 APK 中
          # -u 是更新，-r 是递归
          zip -ur "../$APK_PATH" lib/
          
          echo "✅ 暴力注入完成，已强行将驱动塞入 APK 内部。"

      - name: 7. 上传“焊死”驱动的 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Final-Injected-Arm64
          path: TV/app/build/outputs/apk/leanback/arm64_v8a/debug/*.apk

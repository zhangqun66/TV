name: Build TVBox with Media Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout TVBox
      - name: Checkout TVBox
        uses: actions/checkout@v4
        with:
          path: tv

      # 2️⃣ Checkout Media 源码（同级）
      - name: Checkout Media
        uses: actions/checkout@v4
        with:
          repository: zhangqun66/media
          path: media

      # 3️⃣ 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4️⃣ 确保 gradlew 可执行
      - name: Make gradlew executable
        working-directory: tv
        run: chmod +x gradlew

      # 5️⃣ Gradle projects check（可选，确认 media 被正确引入）
      - name: Gradle projects check
        working-directory: tv
        run: ./gradlew projects

      # 6️⃣ 编译 TVBox（Release）
      - name: Build TVBox
        working-directory: tv
        env:
          GRADLE_OPTS: -Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --refresh-dependencies --stacktrace

      # 7️⃣ 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-apk
          path: tv/app/build/outputs/apk/**/*.apk
